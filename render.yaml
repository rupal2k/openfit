databases: []

services:
  # --- API service ---
  - type: web
    name: openfit-api
    env: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /data
      - key: RP_ID
        sync: false          # set to your Render domain, e.g. openfit.onrender.com
      - key: ORIGIN
        sync: false          # set to https://<your-render-domain>
      - key: RP_NAME
        value: openfit
      - key: INVITE_ONLY
        value: 0
      - key: ADMIN_UIDS
        sync: false          # optional: comma-separated user IDs
      - key: TRUST_PROXY
        value: 2             # hops: Render edge + openfit-web nginx. Verify: client IP must be 2nd from the right in X-Forwarded-For
      - key: REQUIRE_UV
        value: 0             # set to 1 to require PIN/biometric at passkey login (multi-user)
    disk:
      name: openfit-data
      mountPath: /data
      sizeGB: 1

  # --- Web / frontend service ---
  - type: web
    name: openfit-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    buildFilter:
      paths:
        - frontend/**
        - web/**
        - Dockerfile
    envVars:
      - key: API_HOST
        fromService:
          name: openfit-api
          type: web
          property: host
